spring.application.name=legacy-payment-gateway
server.port=8080

# DB_CLOSE_DELAY=-1 keeps the in-memory database alive for the whole run; without it H2
# deletes the database (and its tables) whenever the last pool connection closes.
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
